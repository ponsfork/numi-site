<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Numi</title>
<link rel="icon" type="image/png" href="/logo.png">
<style>
  :root {
    --bg: #0d1015;
    --card: #151a22;
    --card2: #1a202b;
    --text: #eef1f5;
    --muted: #98a2b3;
    --dim: #5d6878;
    --line: #232b38;
    --up: #3ddc84;
    --down: #ff7070;
    --accent: #82b6ff;
    --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: radial-gradient(1200px 500px at 50% -100px, #131926 0%, var(--bg) 60%);
    color: var(--text); min-height: 100vh;
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 36px 22px 80px; }

  header { display: flex; align-items: center; gap: 14px; margin-bottom: 30px; }
  header img { width: 48px; height: 48px; border-radius: 14px; }
  header h1 { font-size: 22px; }
  header .sub { color: var(--muted); font-size: 14px; }
  .spacer { flex: 1; }
  .pill {
    display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px;
    border-radius: 999px; border: 1px solid var(--line); background: var(--card);
    font-size: 13px; font-weight: 600;
  }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--up); }
  .pill.live .dot { background: var(--down); animation: pulse 2s infinite; }
  .pill.live { color: var(--down); }
  @keyframes pulse { 50% { opacity: .35; } }

  .ca {
    display: flex; align-items: center; gap: 12px; width: 100%;
    padding: 13px 18px; margin-bottom: 26px;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    cursor: pointer; font: inherit; color: inherit; text-align: left;
  }
  .ca:hover { border-color: #33405a; }
  .ca b { color: var(--up); font: 700 13px var(--mono); }
  .ca code { flex: 1; font: 13px var(--mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ca span { font: 600 11px var(--mono); color: var(--accent); letter-spacing: .08em; }

  /* hero card */
  .hero {
    background: linear-gradient(180deg, var(--card2), var(--card));
    border: 1px solid var(--line); border-radius: 20px;
    padding: 30px 32px 20px; margin-bottom: 20px;
  }
  .hero .top { display: flex; align-items: flex-start; gap: 24px; flex-wrap: wrap; }
  .hero .label { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .12em; }
  .hero .big { font: 650 46px/1.1 var(--mono); letter-spacing: -.03em; margin: 8px 0 4px; }
  .hero .eth { color: var(--muted); font: 15px var(--mono); }
  .hero .side { margin-left: auto; text-align: right; display: flex; gap: 30px; }
  .hero .side .k { color: var(--muted); font-size: 13px; }
  .hero .side .v { font: 600 20px var(--mono); margin-top: 4px; }
  .hero svg { display: block; width: 100%; height: 110px; margin-top: 16px; }
  .up { color: var(--up); } .down { color: var(--down); }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } .hero .side { margin-left: 0; text-align: left; } }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 20px;
    padding: 24px 24px 12px;
  }
  .card h2 { font-size: 15px; font-weight: 650; margin-bottom: 14px; display: flex; align-items: baseline; gap: 10px; }
  .card h2 small { color: var(--dim); font-weight: 400; font-size: 13px; }

  .hrow { display: flex; align-items: center; gap: 14px; padding: 13px 0; border-bottom: 1px solid var(--line); }
  .hrow:last-child { border-bottom: none; }
  .ava {
    width: 40px; height: 40px; border-radius: 12px; flex: none;
    display: flex; align-items: center; justify-content: center;
    font: 700 14px var(--mono); color: #0d1015;
  }
  .hrow .name { font-weight: 600; }
  .hrow .name a { font-size: 12px; color: var(--dim); }
  .hrow .qty { color: var(--muted); font: 13px var(--mono); }
  .hrow .right { margin-left: auto; text-align: right; }
  .hrow .val { font: 600 15px var(--mono); }
  .hrow .chip { font: 600 13px var(--mono); }

  .trow { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
  .trow:last-child { border-bottom: none; }
  .tdot { width: 8px; height: 8px; border-radius: 50%; background: var(--up); flex: none; }
  .trow .when { color: var(--dim); font: 12px var(--mono); }
  .trow .what { flex: 1; }
  .trow .amt { color: var(--muted); font: 13px var(--mono); }

  .vault { color: var(--muted); font-size: 14px; padding: 14px 0 10px; line-height: 1.9; }
  .vault b { color: var(--text); font-family: var(--mono); }

  details { padding: 8px 0 12px; }
  summary { color: var(--dim); font-size: 13px; cursor: pointer; }

  footer { margin-top: 34px; color: var(--dim); font-size: 13px; text-align: center; line-height: 2; }
  footer a { color: var(--muted); margin: 0 10px; }
  #live { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="/logo.png" alt="">
    <div><h1>Numi</h1><div class="sub">autonomous trading agent</div></div>
    <div class="spacer"></div>
    <div id="live" class="pill live"><span class="dot"></span><span id="liveTxt">LIVE</span></div>
  </header>

  <button class="ca" id="ca">
    <b>$NUMI</b>
    <code>0xa8fb36136cd439f3ddec90bb713954416b826e8d</code>
    <span id="caCopy">COPY</span>
  </button>

  <div class="hero">
    <div class="top">
      <div>
        <div class="label">Portfolio value</div>
        <div class="big" id="heroUsd">—</div>
        <div class="eth" id="heroEth">—</div>
      </div>
      <div class="side">
        <div><div class="k">Trading P&L</div><div class="v" id="pnl">—</div></div>
        <div><div class="k">Fees earned</div><div class="v up" id="fees">—</div></div>
      </div>
    </div>
    <div id="chart"></div>
  </div>

  <div class="grid">
    <div class="card">
      <h2>Holdings <small id="posCount"></small></h2>
      <div id="holdings"></div>
      <div class="vault" id="vault"></div>
    </div>
    <div class="card">
      <h2>Recent trades <small id="tradeCount"></small></h2>
      <div id="activity"></div>
      <details id="skippedWrap" hidden>
        <summary id="skippedSum"></summary>
        <div id="skipped"></div>
      </details>
    </div>
  </div>

  <footer>
    <div>
      <a id="walletLink" href="#" target="_blank" rel="noopener">wallet</a> ·
      <a href="https://github.com/numi-ai/numi-trading-agent" target="_blank" rel="noopener">docs</a> ·
      <a href="https://x.com/pons_numi_agent" target="_blank" rel="noopener">@pons_numi_agent</a>
    </div>
    <div id="meta">—</div>
    <div>Not financial advice. Figures are the agent's own on-chain wallet and ledger.</div>
  </footer>
</div>

<script>
const DATA_URL = "https://raw.githubusercontent.com/ponsfork/numi-data/main/snapshot.json";
const $ = id => document.getElementById(id);
let E = null;

const usd = v => v==null||!isFinite(v)||!E ? "—" : "$" + (v*E).toLocaleString("en-US",{maximumFractionDigits:2});
const usdS = v => v==null||!isFinite(v)||!E ? "—" : (v>0?"+":v<0?"−":"") + "$" + Math.abs(v*E).toLocaleString("en-US",{maximumFractionDigits:2});
const qty = v => v>=1e6 ? (v/1e6).toFixed(2)+"M" : v>=1e3 ? (v/1e3).toFixed(1)+"K" : v>=1 ? v.toFixed(2) : v.toFixed(4);
const pct = v => v==null ? "" : (v>0?"+":"") + v.toFixed(2) + "%";
const sgn = v => v>0.0001 ? "up" : v<-0.0001 ? "down" : "";
const when = ts => { const d=new Date(ts); return d.toLocaleDateString("en-GB",{day:"numeric",month:"short"})+" "+d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}); };
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const AVA = ["#7db4ff","#3ddc84","#ffb74d","#ce93d8","#4dd0e1","#f48fb1","#aed581"];
const avaColor = s => AVA[[...s].reduce((a,c)=>a+c.charCodeAt(0),0)%AVA.length];

function render(s){
  E = s.market.ethUsd;
  const w = s.wallet, p = s.portfolio;

  $("live").className = "pill" + (s.mode.running ? " live" : "");
  $("liveTxt").textContent = s.mode.running ? (s.mode.paper ? "PAPER" : "LIVE · REAL FUNDS") : "OFFLINE";

  const worth = w.netWorthEth ?? w.balanceEth;
  $("heroUsd").textContent = usd(worth);
  $("heroEth").textContent = (worth==null?"—":worth.toFixed(4)+" ETH") + " on-chain · cash " + (p.cashEth==null?"—":p.cashEth.toFixed(4)+" ETH");
  $("pnl").textContent = usdS(p.totalPnlEth);
  $("pnl").className = "v " + sgn(p.totalPnlEth*E);
  $("fees").textContent = usdS(p.feesEarnedEth);

  const pts = s.equityCurve || [];
  if (pts.length > 1) {
    const W=1000,H=110,P=4;
    const xs=pts.map(d=>d.ts), ys=pts.map(d=>d.equityEth);
    const x0=Math.min(...xs), x1=Math.max(...xs);
    let y0=Math.min(...ys), y1=Math.max(...ys);
    if (y1-y0<1e-12){y0-=1e-9;y1+=1e-9;}
    const X=v=>P+(v-x0)/(x1-x0||1)*(W-2*P), Y=v=>H-P-(v-y0)/(y1-y0)*(H-2*P);
    const line = pts.map((d,i)=>(i?"L":"M")+X(d.ts).toFixed(1)+" "+Y(d.equityEth).toFixed(1)).join(" ");
    const col = ys[ys.length-1]>=ys[0] ? "#3ddc84" : "#ff7070";
    $("chart").innerHTML =
      `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
        <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${col}" stop-opacity=".22"/><stop offset="100%" stop-color="${col}" stop-opacity="0"/>
        </linearGradient></defs>
        <path d="${line} L ${X(x1).toFixed(1)} ${H-P} L ${X(x0).toFixed(1)} ${H-P} Z" fill="url(#g)"/>
        <path d="${line}" fill="none" stroke="${col}" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
      </svg>`;
  }

  $("posCount").textContent = s.positions.length + " open";
  $("holdings").innerHTML = s.positions.map(x=>`
    <div class="hrow">
      <div class="ava" style="background:${avaColor(x.label)}">${esc(x.label.slice(0,3))}</div>
      <div>
        <div class="name">${esc(x.label)}${x.address?` <a href="${w.explorer}/token/${x.address}" target="_blank" rel="noopener">↗</a>`:""}</div>
        <div class="qty">${qty(x.quantity)}</div>
      </div>
      <div class="right">
        <div class="val">${x.valueEth==null?"—":usd(x.valueEth)}</div>
        <div class="chip ${sgn(x.unrealizedPct)}">${x.unrealizedPct==null?"":pct(x.unrealizedPct)}</div>
      </div>
    </div>`).join("") || '<div class="vault">no positions yet</div>';

  const extra=(w.extraTokens||[]).filter(t=>t.balance>0);
  $("vault").innerHTML = extra.length
    ? "🔒 Vault: " + extra.map(t=>`<b>${qty(t.balance)} ${esc(t.symbol)}</b>`).join(" · ") + " — never sold"
    : "";

  $("tradeCount").textContent = s.stats.fills + " fills";
  $("activity").innerHTML = s.trades.slice(0,12).map(t=>`
    <div class="trow">
      <span class="tdot" style="background:${t.side==="buy"?"var(--up)":"var(--down)"}"></span>
      <div>
        <div class="what"><b>${t.side==="buy"?"Bought":"Sold"}</b> ${qty(t.quantity)} ${esc(t.label)}</div>
        <div class="when">${when(t.ts)}${t.txHash&&!t.paper?` · <a href="${w.explorer}/tx/${t.txHash}" target="_blank" rel="noopener">tx↗</a>`:""}</div>
      </div>
      <div class="amt">${usd(t.grossEth)}</div>
    </div>`).join("") || '<div class="vault">no trades yet</div>';

  if (s.rejections.length) {
    $("skippedWrap").hidden = false;
    $("skippedSum").textContent = `${s.rejections.length} skipped by the agent`;
    $("skipped").innerHTML = s.rejections.slice(0,8).map(t=>`
      <div class="trow"><span class="tdot" style="background:var(--dim)"></span>
      <div><div class="what" style="color:var(--muted)">${esc(t.label)}</div>
      <div class="when">${esc((t.reason||"").slice(0,80))}</div></div></div>`).join("");
  }

  $("walletLink").href = `${w.explorer}/address/${w.address}`;
  $("meta").textContent = `ETH $${E?E.toLocaleString("en-US"):"—"} · updated ${when(s.generatedAt)}`;
}

$("ca").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText("0xa8fb36136cd439f3ddec90bb713954416b826e8d"); } catch {}
  $("caCopy").textContent = "COPIED ✓";
  setTimeout(()=>$("caCopy").textContent="COPY", 1500);
});

async function poll(){
  try {
    const r = await fetch(DATA_URL + "?t=" + Math.floor(Date.now()/20000), {cache:"no-store"});
    if (r.ok) render(await r.json());
  } catch {}
}
poll(); setInterval(poll, 15000);
</script>
</body>
</html>
