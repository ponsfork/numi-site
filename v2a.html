<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Numi</title>
<link rel="icon" type="image/png" href="/logo.png">
<style>
  :root {
    --bg: #0b0d10;
    --text: #eceef1;
    --muted: #9aa3b2;
    --dim: #5b6572;
    --line: #1d232e;
    --up: #34d17b;
    --down: #ff6b6b;
    --accent: #7db4ff;
    --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { opacity: .85; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 40px 24px 80px; }

  /* header */
  header { display: flex; align-items: center; gap: 14px; margin-bottom: 36px; }
  header img { width: 46px; height: 46px; border-radius: 12px; }
  header h1 { font-size: 22px; letter-spacing: -.02em; }
  header .sub { color: var(--muted); font-size: 14px; }
  .spacer { flex: 1; }
  .live {
    display: inline-flex; align-items: center; gap: 8px;
    font: 600 12px/1 var(--mono); letter-spacing: .1em; color: var(--down);
  }
  .live .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--down); animation: pulse 2s infinite; }
  .live.off { color: var(--dim); } .live.off .dot { background: var(--dim); animation: none; }
  @keyframes pulse { 50% { opacity: .4; } }

  /* contract bar */
  .ca {
    display: flex; align-items: center; gap: 12px; width: 100%;
    padding: 12px 16px; margin-bottom: 44px;
    background: #10141a; border: 1px solid var(--line); border-radius: 12px;
    cursor: pointer; font: inherit; color: inherit; text-align: left;
  }
  .ca:hover { border-color: #2a3342; }
  .ca b { color: var(--up); font: 700 13px var(--mono); }
  .ca code { flex: 1; font: 13px var(--mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ca span { font: 600 11px var(--mono); color: var(--accent); letter-spacing: .08em; }

  /* hero */
  .hero { margin-bottom: 8px; }
  .hero .label { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .14em; margin-bottom: 10px; }
  .hero .value { font: 600 52px/1.05 var(--mono); letter-spacing: -.03em; }
  .hero .sub { color: var(--muted); font: 15px var(--mono); margin-top: 8px; }

  .stats { display: flex; gap: 40px; margin: 30px 0 10px; flex-wrap: wrap; }
  .stat .k { color: var(--muted); font-size: 13px; margin-bottom: 4px; }
  .stat .v { font: 600 19px var(--mono); }
  .up { color: var(--up); } .down { color: var(--down); }

  .chart { margin: 26px 0 0; }
  .chart svg { display: block; width: 100%; height: 130px; }
  .chart .range { display: flex; justify-content: space-between; color: var(--dim); font: 12px var(--mono); margin-top: 6px; }

  /* sections */
  section { margin-top: 60px; }
  section > h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: .14em;
    color: var(--muted); font-weight: 600; margin-bottom: 18px;
  }

  .row {
    display: flex; align-items: center; gap: 14px;
    padding: 15px 4px; border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: none; }
  .row .name { font-weight: 600; font-size: 16px; }
  .row .name a { font-size: 12px; color: var(--dim); margin-left: 4px; }
  .row .qty { color: var(--muted); font: 13px var(--mono); }
  .row .right { margin-left: auto; text-align: right; }
  .row .val { font: 600 16px var(--mono); }
  .row .chip { font: 600 13px var(--mono); margin-top: 2px; }

  /* activity */
  .act { display: flex; align-items: baseline; gap: 14px; padding: 13px 4px; border-bottom: 1px solid var(--line); }
  .act:last-child { border-bottom: none; }
  .act .when { color: var(--dim); font: 13px var(--mono); min-width: 88px; }
  .act .what { flex: 1; font-size: 15px; }
  .act .what b { font-weight: 600; }
  .act .amt { color: var(--muted); font: 14px var(--mono); }
  .act .tx { font: 13px var(--mono); }

  .note { color: var(--dim); font-size: 14px; margin-top: 14px; }
  details { margin-top: 16px; }
  summary { color: var(--dim); font-size: 14px; cursor: pointer; user-select: none; }
  summary:hover { color: var(--muted); }
  details .act .what { color: var(--muted); }

  .also { color: var(--muted); font-size: 14px; margin-top: 18px; line-height: 1.8; }
  .also b { color: var(--text); font-family: var(--mono); font-weight: 600; }

  footer {
    margin-top: 80px; padding-top: 24px; border-top: 1px solid var(--line);
    color: var(--dim); font-size: 13px; line-height: 2;
  }
  footer .links { display: flex; gap: 22px; flex-wrap: wrap; margin-bottom: 8px; }
  footer a { color: var(--muted); }
  @media (max-width: 560px) {
    .hero .value { font-size: 40px; }
    .stats { gap: 24px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="/logo.png" alt="">
    <div>
      <h1>Numi</h1>
      <div class="sub">autonomous trading agent</div>
    </div>
    <div class="spacer"></div>
    <div id="live" class="live"><span class="dot"></span><span id="liveTxt">LIVE</span></div>
  </header>

  <button class="ca" id="ca">
    <b>$NUMI</b>
    <code>0xa8fb36136cd439f3ddec90bb713954416b826e8d</code>
    <span id="caCopy">COPY</span>
  </button>

  <div class="hero">
    <div class="label">Portfolio</div>
    <div class="value" id="heroUsd">—</div>
    <div class="sub" id="heroEth">— · on-chain</div>
  </div>

  <div class="stats">
    <div class="stat"><div class="k">Trading P&L</div><div class="v" id="pnl">—</div></div>
    <div class="stat"><div class="k">Fees earned</div><div class="v up" id="fees">—</div></div>
    <div class="stat"><div class="k">Positions</div><div class="v" id="posCount">—</div></div>
  </div>

  <div class="chart" id="chart"></div>

  <section>
    <h2>Holdings</h2>
    <div id="holdings"></div>
    <div class="also" id="also"></div>
  </section>

  <section>
    <h2>Activity</h2>
    <div id="activity"></div>
    <details id="skippedWrap" hidden>
      <summary id="skippedSum"></summary>
      <div id="skipped"></div>
    </details>
  </section>

  <footer>
    <div class="links">
      <a id="walletLink" href="#" target="_blank" rel="noopener">wallet ↗</a>
      <a href="https://github.com/numi-ai/numi-trading-agent" target="_blank" rel="noopener">docs ↗</a>
      <a href="https://x.com/pons_numi_agent" target="_blank" rel="noopener">@pons_numi_agent</a>
    </div>
    <div id="meta">—</div>
    <div>Not financial advice. All figures come from the agent's own on-chain wallet and ledger.</div>
  </footer>
</div>

<script>
const DATA_URL = "https://raw.githubusercontent.com/ponsfork/numi-data/main/snapshot.json";
const $ = id => document.getElementById(id);
let E = null;

const usd = v => v==null||!isFinite(v)||!E ? "—" : "$" + (v*E).toLocaleString("en-US",{maximumFractionDigits:2});
const usdS = v => v==null||!isFinite(v)||!E ? "—" : (v>0?"+":v<0?"−":"") + "$" + Math.abs(v*E).toLocaleString("en-US",{maximumFractionDigits:2});
const qty = v => v>=1e6 ? (v/1e6).toFixed(2)+"M" : v>=1e3 ? (v/1e3).toFixed(1)+"K" : v>=1 ? v.toFixed(2) : v.toFixed(4);
const pct = v => v==null ? "" : (v>0?"+":"") + v.toFixed(2) + "%";
const sgn = v => v>0.0001 ? "up" : v<-0.0001 ? "down" : "";
const when = ts => { const d=new Date(ts); return d.toLocaleDateString("en-GB",{day:"numeric",month:"short"})+" "+d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}); };
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(s){
  E = s.market.ethUsd;
  const w = s.wallet, p = s.portfolio;

  $("live").className = "live" + (s.mode.running ? "" : " off");
  $("liveTxt").textContent = s.mode.running ? (s.mode.paper ? "PAPER" : "LIVE") : "OFFLINE";

  const worth = w.netWorthEth ?? w.balanceEth;
  $("heroUsd").textContent = usd(worth);
  $("heroEth").textContent = (worth==null?"—":worth.toFixed(4)+" ETH") + " · on-chain";

  $("pnl").textContent = usdS(p.totalPnlEth);
  $("pnl").className = "v " + sgn(p.totalPnlEth*E);
  $("fees").textContent = usdS(p.feesEarnedEth);
  $("posCount").textContent = s.positions.length;

  // chart
  const pts = s.equityCurve || [];
  if (pts.length > 1) {
    const W=1000,H=130,P=4;
    const xs=pts.map(d=>d.ts), ys=pts.map(d=>d.equityEth);
    const x0=Math.min(...xs), x1=Math.max(...xs);
    let y0=Math.min(...ys), y1=Math.max(...ys);
    if (y1-y0<1e-12){y0-=1e-9;y1+=1e-9;}
    const X=v=>P+(v-x0)/(x1-x0||1)*(W-2*P), Y=v=>H-P-(v-y0)/(y1-y0)*(H-2*P);
    const line = pts.map((d,i)=>(i?"L":"M")+X(d.ts).toFixed(1)+" "+Y(d.equityEth).toFixed(1)).join(" ");
    const col = ys[ys.length-1]>=ys[0] ? "#34d17b" : "#ff6b6b";
    $("chart").innerHTML =
      `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
        <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${col}" stop-opacity=".18"/><stop offset="100%" stop-color="${col}" stop-opacity="0"/>
        </linearGradient></defs>
        <path d="${line} L ${X(x1).toFixed(1)} ${H-P} L ${X(x0).toFixed(1)} ${H-P} Z" fill="url(#g)"/>
        <path d="${line}" fill="none" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke"/>
      </svg>
      <div class="range"><span>${when(x0)}</span><span>${when(x1)}</span></div>`;
  }

  // holdings
  $("holdings").innerHTML = s.positions.map(x=>`
    <div class="row">
      <div>
        <div class="name">${esc(x.label)}${x.address?` <a href="${w.explorer}/token/${x.address}" target="_blank" rel="noopener">↗</a>`:""}</div>
        <div class="qty">${qty(x.quantity)}</div>
      </div>
      <div class="right">
        <div class="val">${x.valueEth==null?"—":usd(x.valueEth)}</div>
        <div class="chip ${sgn(x.unrealizedPct)}">${x.unrealizedPct==null?"":pct(x.unrealizedPct)}</div>
      </div>
    </div>`).join("") || '<div class="note">no positions yet</div>';

  const extra=(w.extraTokens||[]).filter(t=>t.balance>0);
  $("also").innerHTML = extra.length
    ? "Vault (never sold): " + extra.map(t=>`<b>${qty(t.balance)} ${esc(t.symbol)}</b>`).join(" · ")
      + ` · fees claimed to date <b>${usdS(p.feesEarnedEth)}</b>`
    : "";

  // activity
  const act = t => `
    <div class="act">
      <div class="when">${when(t.ts)}</div>
      <div class="what"><b>${t.side==="buy"?"Bought":"Sold"}</b> ${qty(t.quantity)} ${esc(t.label)}</div>
      <div class="amt">${usd(t.grossEth)}</div>
      ${t.txHash && !t.paper ? `<a class="tx" href="${w.explorer}/tx/${t.txHash}" target="_blank" rel="noopener">tx↗</a>` : ""}
    </div>`;
  $("activity").innerHTML = s.trades.slice(0,20).map(act).join("") || '<div class="note">no trades yet</div>';

  if (s.rejections.length) {
    $("skippedWrap").hidden = false;
    $("skippedSum").textContent = `${s.rejections.length} skipped — the agent decided not to trade`;
    $("skipped").innerHTML = s.rejections.slice(0,10).map(t=>`
      <div class="act"><div class="when">${when(t.ts)}</div>
      <div class="what">${esc(t.label)} — ${esc((t.reason||"").slice(0,90))}</div></div>`).join("");
  }

  $("walletLink").href = `${w.explorer}/address/${w.address}`;
  $("meta").textContent = `ETH $${E?E.toLocaleString("en-US"):"—"} · ${s.stats.fills} trades since ${s.stats.firstTradeTs?when(s.stats.firstTradeTs):"—"} · updated ${when(s.generatedAt)}`;
}

$("ca").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText("0xa8fb36136cd439f3ddec90bb713954416b826e8d"); } catch {}
  $("caCopy").textContent = "COPIED ✓";
  setTimeout(()=>$("caCopy").textContent="COPY", 1500);
});

async function poll(){
  try {
    const r = await fetch(DATA_URL + "?t=" + Math.floor(Date.now()/20000), {cache:"no-store"});
    if (r.ok) render(await r.json());
  } catch { $("live").className="live off"; $("liveTxt").textContent="…"; }
}
poll(); setInterval(poll, 15000);
</script>
</body>
</html>
